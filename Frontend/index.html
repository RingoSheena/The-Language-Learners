<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yomu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #fdfcf9;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1rem;
  }

  h1 {
    font-size: 4rem;
    letter-spacing: -0.02em;
  }

  p {
    margin-top: 0.5rem;
    font-size: 1.1rem;
    color: #666;
  }

  .upload-section {
    margin-top: 2rem;
    text-align: center;
  }

  .upload-btn,
  .read-btn {
    display: inline-block;
    padding: 0.6rem 1.2rem;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .upload-btn:hover,
  .read-btn:hover {
    background: #333;
  }

  #file-name {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #333;
  }

  #error-message {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #b3261e;
    display: none;
  }

  .read-btn {
    margin-top: 1rem;
    display: none;
  }

  .nav-buttons {
    margin-top: 2rem;
    display: none;
    gap: 1rem;
  }

  .nav-buttons button {
    padding: 0.5rem 1rem;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .nav-buttons button:hover {
    background: #333;
  }

  #viewer {
    margin-top: 1rem;
    width: 100%;
    max-width: 700px;
    height: 600px;
    border: 1px solid #ddd;
    border-radius: 4px;
    display: none;
  }
</style>
</head>
<body>
  <h1>読む</h1>
  <p>Yomu — read, look up, remember.</p>

  <div class="upload-section">
    <label for="epub-upload" class="upload-btn">Upload .epub</label>
    <input type="file" id="epub-upload" accept=".epub" hidden />
    <p id="file-name"></p>
    <p id="error-message">Please upload a valid .epub file.</p>
    <button id="read-btn" class="read-btn">Read</button>
  </div>

  <div class="nav-buttons">
    <button id="prev-btn">Previous</button>
    <button id="next-btn">Next</button>
  </div>
  <div id="viewer"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
